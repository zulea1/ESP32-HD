; Version   : see FIRMWARE_VERSION_STR / FIRMWARE_BUILD_NUM_STR in src/core/config.h
; ARCHITECTURAL OVERVIEW:
; - Dedicated HD motorcycle diagnostic service tester.
; - Target MCU      : ESP32 (Dual-Core Xtensa LX6 @ 240 MHz)
; - Safe Boot Pin   : GPIO 39 (Force Safe Boot when held LOW at power-up)
; - Flash Memory    : 4 MB DIO SPI Flash using partitions_4mb.csv (No SPIFFS)
;                     (factory @ 0x10000 [1216 KB], ota_0 @ 0x140000 [2816 KB])
; - Pre-Build Hook  : Runs `build_web_ui.py` before compilation to package
;                     `web_src/` (HTML/CSS/JS) into C++11 PROGMEM raw string
;                     headers inside `src/web_ui/`.
; ==============================================================================
;
; THREE environments are defined in this file. Quick reference (details for each are in
; its own section below):
;
;   [env:esp32_hd]      The main diagnostic app. This is what you build/flash day to day.
;                            pio run -e esp32_hd                 (build only)
;                            pio run -e esp32_hd -t upload        (build + flash over USB, normal use)
;                            pio run -e esp32_hd -t upload --upload-port <PORT>   (if autodetect picks the wrong port)
;
;   [env:safeboot_hd]   The minimal safe-boot/recovery firmware for the FACTORY partition.
;                        `-t upload` on THIS env does NOT work correctly (see the big warning
;                        in its own section below) - build it, then flash it by hand:
;                            pio run -e safeboot_hd
;                            python -m esptool --chip esp32 --port <PORT> --baud 921600 write_flash 0x10000 .pio/build/safeboot_hd/firmware.bin
;                            python -m esptool --chip esp32 --port <PORT> erase_region 0xe000 0x2000
;
;   [env:flash_full]    One-shot "blank board to fully working" target: fully erases the chip,
;                        builds BOTH firmwares, and writes bootloader + partition table +
;                        boot_app0 + safe-boot (factory) + main app (ota_0) in one command.
;                        WARNING: erase_flash also wipes NVS (all saved settings - Wi-Fi
;                        SSID/password, CAN bitrate, etc. reset to firmware defaults).
;                            pio run -e flash_full -t fullflash
;                            pio run -e flash_full -t fullflash --upload-port <PORT>   (if autodetect picks the wrong port)
;
; For normal day-to-day development (you already have safe-boot on the board from a previous
; full flash, and are only changing the main app), `pio run -e esp32_hd -t upload` is all you
; need - it is faster and does not touch NVS or the factory partition.

; NOTE on the "platform" pin below: the official PlatformIO "espressif32" platform has not
; shipped a newer Arduino-ESP32 core since 2.0.17 (ESP-IDF 4.4.7) for a long time. To get a
; genuinely newer Arduino core, this project is pinned to the community "pioarduino" fork
; (https://github.com/pioarduino/platform-espressif32), release 55.03.39, which bundles
; Arduino-ESP32 3.3.9 on ESP-IDF 5.5.4. This is a different platform *source* (a direct
; release .zip URL), not just a higher version number on the same registry entry.
;
; Compatibility check performed for this move (no real hardware available to flash-test,
; so verify on your board before relying on it):
;   - can_driver.cpp uses the ESP-IDF "legacy" TWAI driver (driver/twai.h: twai_driver_install,
;     twai_start, twai_transmit, twai_receive, twai_get_status_info, twai_initiate_recovery,
;     TWAI_GENERAL_CONFIG_DEFAULT, TWAI_FILTER_CONFIG_ACCEPT_ALL, TWAI_TIMING_CONFIG_*BITS).
;     Per Espressif's own ESP-IDF 5.5 migration guide, this legacy driver is still present
;     and exported by driver/twai.h in 5.5.x (a newer *alternative* TWAI driver was added
;     alongside it, not instead of it) - just don't mix calls from both driver APIs in the
;     same program, which this firmware does not do.
;   - No other ESP-IDF/Arduino-ESP32 3.x breaking API (ledc*, SPIFFS, analogWrite rework,
;     etc.) is used anywhere in src/.

[platformio]
;default_envs = safeboot_hd
default_envs = esp32_hd

; =============================================================================
; env:esp32_hd - THE MAIN DIAGNOSTIC APP. This is the firmware you work on day to day:
; UDS/CAN transport, module scanning, DTC read/clear, live data, actuator tests, ECU
; identification, special functions, guided ABS bleed, the web UI, OTA updates. Flashed/OTA'd
; to the ota_0 partition (0x140000).
;
; HOW TO BUILD:
;     pio run -e esp32_hd
; HOW TO BUILD + FLASH (normal use - this is the one you'll use most):
;     pio run -e esp32_hd -t upload
;     pio run -e esp32_hd -t upload --upload-port /dev/ttyUSB0      (Linux/macOS, if needed)
;     pio run -e esp32_hd -t upload --upload-port COM5              (Windows, if needed)
; HOW TO MONITOR SERIAL LOG AFTER FLASHING:
;     pio run -e esp32_hd -t upload -t monitor
; This writes bootloader + partition table + boot_app0 + the app itself - everything EXCEPT
; the safe-boot/factory firmware, which this env never touches. If you are flashing a brand
; new board for the first time (factory partition is empty), use [env:flash_full] instead so
; the safe-boot fallback is actually present on the chip.
; =============================================================================
[env:esp32_hd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino

; Execute Python asset packager prior to compiling C++ sources
extra_scripts = pre:build_web_ui.py

; Run Xtensa LX6 cores at maximum 240 MHz clock for sub-millisecond CAN diagnostics
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; 4MB Flash, Tasmota-style: small FACTORY (safe boot) fw + one large app slot (ota_0 = 0x2C0000 = 2816 KB).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 2883584
board_build.partitions = partitions_4mb.csv

; Serial Monitor Configuration
monitor_speed = 921600      ; must match LOG_BAUD in src/core/async_log.h
monitor_filters = esp32_exception_decoder, time

; src/ is split into subfolders (core/, modules/<ecm|abs|bcm|spdo|rad|cfg|lhc|rhc>/, diagnostics/, web_ui/) for
; readability, but every file still uses plain, path-free #include "foo.h" across those folders (e.g.
; src/diagnostics/ecu_info.cpp includes "config.h", which lives in src/core/). PlatformIO only auto-adds the
; top-level src/ directory itself to the include path, not its subdirectories, so each subfolder that is
; `#include`d from outside itself needs an explicit -I here or every cross-folder include fails to resolve.
build_unflags = -flto=auto
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DBOARD_HAS_4MB_FLASH=1
    -Wno-attributes
    -Isrc/core
    -Isrc/modules/ecm
    -Isrc/modules/abs
    -Isrc/modules/bcm
    -Isrc/modules/spdo
    -Isrc/modules/rad
    -Isrc/modules/cfg
    -Isrc/modules/lhc
    -Isrc/modules/rhc
    -Isrc/diagnostics

; The full diagnostic app. Flashed/OTA'd to the ota_0 partition. Excludes the minimal safe-boot entry point
; (that folder has its own setup()/loop() + settings for the factory firmware).
build_src_filter = +<*> -<safeboot_app/>

; =============================================================================
; env:safeboot_hd - the MINIMAL safe-boot / recovery firmware for the FACTORY partition (0x10000).
; It compiles ONLY: safeboot_app/safeboot_main.cpp + core/safe_boot.cpp + core/async_log.cpp (no
; CAN/UDS/modules), so it stays well under the 1216 KB factory slot and can always re-flash a
; broken app. This is what the main app falls back to if an OTA update ever fails, or if the
; user forces it (GPIO 39 held LOW at power-up, or Settings -> Safe Boot in the web UI).
;
; HOW TO BUILD (build only - do NOT run `-t upload` on this env, see warning below):
;     pio run -e safeboot_hd
; HOW TO FLASH (build it first, then flash BY HAND to the factory offset):
;     pio run -e safeboot_hd
;     python -m esptool --chip esp32 --port <PORT> --baud 921600 write_flash 0x10000 .pio/build/safeboot_hd/firmware.bin
;     python -m esptool --chip esp32 --port <PORT> erase_region 0xe000 0x2000      # clear otadata -> boots factory
; (NVS at 0x9000 is untouched by the above.)
;
; WARNING - `pio run -e safeboot_hd -t upload` does NOT work: pioarduino always writes the app
; to the ota_0 slot, so this recovery fw would land in ota_0 (the WRONG place - that slot is
; reserved for the main app). Always flash this one by hand as shown above, or use
; [env:flash_full] which does it correctly as part of a full chip flash.
; =============================================================================
[env:safeboot_hd]
extends = env:esp32_hd
board_upload.maximum_size = 1245184
build_src_filter = -<*> +<core/safe_boot.cpp> +<core/async_log.cpp> +<safeboot_app/>
build_flags =
    ${env:esp32_hd.build_flags}
    -DSAFEBOOT_BUILD=1

board_upload.offset = 0x10000
upload_command =
    python -m esptool --chip esp32 --port $UPLOAD_PORT --baud $UPLOAD_SPEED write_flash 0x10000 $SOURCE && python -m esptool --chip esp32 --port $UPLOAD_PORT erase_region 0xe000 0x2000

; =============================================================================
; env:flash_full - ONE-SHOT "blank board to fully working" target.
;
; Fully erases the ENTIRE flash chip, builds BOTH firmwares fresh (esp32_hd + safeboot_hd),
; then writes everything in one command: bootloader + partition table + boot_app0 + the
; safe-boot/recovery firmware (factory slot, 0x10000) + the main app (ota_0 slot, 0x140000).
; See flash_full.py for exactly what it does and why.
;
; Use this for a brand-new/blank board, or whenever you want a guaranteed-clean re-flash
; (e.g. after changing partitions_4mb.csv, or to rule out stale NVS/OTA state while debugging).
;
; WARNING: this ERASES NVS TOO - all saved settings (Wi-Fi SSID/password, CAN bitrate, etc.)
; are wiped and reset to firmware defaults. For routine app-only updates where you want to
; KEEP your settings, use `pio run -e esp32_hd -t upload` instead (see that env's section
; above) - it never touches NVS or the factory partition.
;
; HOW TO RUN:
;     pio run -e flash_full -t fullflash
;     pio run -e flash_full -t fullflash --upload-port /dev/ttyUSB0     (Linux/macOS, if needed)
;     pio run -e flash_full -t fullflash --upload-port COM5             (Windows, if needed)
;
; If the custom target above ever fails to run on your PlatformIO Core version, flash_full.py
; has the exact manual command sequence to reproduce it by hand.
; =============================================================================
[env:flash_full]
extends = env:esp32_hd
extra_scripts =
    pre:build_web_ui.py
    flash_full.py
